# Everything Coffernest needs on one machine: Postgres, MinIO (files) and the API.
#   cp .env.selfhost.example .env   # then fill in the secrets
#   docker compose up -d --build
# The server is then on http://<this-machine>:8080: enter that address in the iPhone app.
# Put a TLS proxy in front of it to reach it from outside your home network.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffernest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: coffernest
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=512MB
      -c max_connections=30 -c work_mem=4MB
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffernest"]
      interval: 5s
      retries: 20

  minio:
    image: coollabsio/minio:latest  # community build: MinIO no longer publishes images
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    # Browsers upload bills and statements straight to MinIO with presigned URLs,
    # so S3_PUBLIC_URL must point at this port as your devices see it.
    ports: ["9000:9000"]
    volumes: [miniodata:/data]

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://coffernest:${POSTGRES_PASSWORD}@postgres:5432/coffernest
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: coffernest
      RUN_WORKER: "true"
    ports: ["8080:8000"]

volumes:
  pgdata:
  miniodata:
