# Local development dependencies only (Postgres and MinIO). See SELF_HOSTING.md to run everything.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coffernest
      POSTGRES_PASSWORD: coffernest
      POSTGRES_DB: coffernest
    # Memory-lean tuning that suits a small home server.
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=512MB
      -c max_connections=30 -c work_mem=4MB
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffernest"]
      interval: 3s
      retries: 20

  minio:
    image: coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
