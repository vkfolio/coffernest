[project]
name = "coffernest"
version = "0.1.0"
description = "Household finance monitor and AI advisor — API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "pyotp>=2.9",
    "python-dateutil>=2.9",
    "boto3>=1.35",
    "python-multipart>=0.0.17",
    "pywebpush>=2.0",
    "httpx>=0.28",
    "pypdfium2>=5.14.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "cryptography>=50.0.2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
ai = ["claude-agent-sdk>=0.1"]

[project.scripts]
coffernest = "coffernest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
    "boto3-stubs[s3]",
    "pypdf[crypto]>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coffernest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywebpush.*", "claude_agent_sdk.*", "asyncpg.*", "pypdfium2.*", "openpyxl.*", "pillow_heif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
